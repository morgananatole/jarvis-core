<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS · Instalação e diagnóstico</title><style>:root{font:16px system-ui;color-scheme:dark}body{margin:0;background:#081522;color:#e6f4f8;padding:18px}main{max-width:760px;margin:auto}h1{font-size:25px}.card{border:1px solid #426479;border-radius:18px;padding:18px;margin:14px 0;background:#102636}button,input,select,textarea{font:inherit;min-height:44px;border-radius:9px;border:1px solid #6c99a8;padding:9px;background:#132f42;color:#fff;max-width:100%}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #9ce8de}label{display:block;margin:12px 0}textarea{width:95%;min-height:70px}.row{display:flex;flex-wrap:wrap;gap:8px}.muted{color:#aec8d3;font-size:14px}li{padding:7px}strong{color:#b4ffec}</style></head><body><main><h1>JARVIS · Caminho de instalação</h1><p class="muted">Registro local de etapas e bloqueios. Nenhuma senha, token, telefone ou dado de cliente é armazenado. Esta página não configura Meta nem Render automaticamente.</p><div class="card"><h2 id="title">1. Verificar o serviço</h2><p id="instruction"></p><label>Resultado da etapa<select id="outcome"><option value="pending">Não verificado</option><option value="passed">Concluído com evidência</option><option value="blocked">Bloqueado</option><option value="skipped">Adiado</option></select></label><label>Observação sem dados pessoais<textarea id="note" maxlength="300" placeholder="Ex.: diagnóstico autenticado retornou status de conexão não confirmado"></textarea></label><div class="row"><button id="save">Registrar etapa</button><button id="next">Próxima etapa</button><button id="previous">Anterior</button></div></div><div class="card"><h2>Trilha de prontidão</h2><ol id="steps"></ol><p id="summary" role="status"></p><div class="row"><button id="export">Copiar relatório sanitizado</button><button id="clear">Limpar registro local</button></div></div></main><script>
'use strict';const items=[['Serviço','Verificar /ready e distinguir HTTP 200 de integração funcional.'],['Conta Meta','Confirmar titularidade, número, WABA e status de cadastro pela interface oficial, sem migrar ou excluir.'],['API Meta','Executar diagnóstico autenticado /whatsapp/connection; não expor token nem número completo.'],['Webhook','Confirmar assinatura, eventos de mensagem e recebimento real com registro sem conteúdo pessoal.'],['Envio e entrega','Fazer teste autorizado com destinatário de teste; distinguir aceito, enviado e entregue.'],['Coexistência','Validar oficialmente uso simultâneo no aplicativo WhatsApp Business e Cloud API; não presumir suporte.'],['PULSE','Validar login, cadastro, inbox, pausa humana, respostas e registros de entrega.'],['Prontidão','Revisar falhas, decidir go/no-go e registrar versão, data e evidências.']];let index=0;const state=items.map(()=>({outcome:'pending',note:''}));const by=id=>document.getElementById(id);function render(){by('title').textContent=(index+1)+'. '+items[index][0];by('instruction').textContent=items[index][1];by('outcome').value=state[index].outcome;by('note').value=state[index].note;by('steps').replaceChildren();items.forEach((it,i)=>{const li=document.createElement('li');li.textContent=(i===index?'→ ':'')+it[0]+' — '+state[i].outcome;by('steps').append(li)});by('summary').textContent=state.filter(x=>x.outcome==='passed').length+'/'+items.length+' etapas concluídas (declaradas; sem verificação automática).'}by('save').onclick=()=>{state[index]={outcome:by('outcome').value,note:by('note').value.trim()};render()};by('next').onclick=()=>{index=Math.min(index+1,items.length-1);render()};by('previous').onclick=()=>{index=Math.max(0,index-1);render()};by('export').onclick=()=>{const report={type:'jarvis-readiness-local',version:1,steps:items.map((x,i)=>({step:x[0],status:state[i].outcome,note:state[i].note}))};const txt=JSON.stringify(report,null,2);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>by('summary').textContent='Relatório copiado. Revise antes de compartilhar.').catch(()=>by('summary').textContent='Cópia não disponível neste navegador.');else by('summary').textContent='Cópia não disponível neste navegador.'};by('clear').onclick=()=>{if(!confirm('Limpar os registros desta página?'))return;state.forEach(x=>{x.outcome='pending';x.note=''});index=0;render()};render();
</script></body></html>
